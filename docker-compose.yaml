services:
  sanchezdns:
    image: mizle/sanchezdns:latest
    container_name: sanchezdns
    platform: linux/amd64
    ports:
      - 3000:80
    environment:
      - AWS_REQUEST_CHECKSUM_CALCULATION=WHEN_REQUIRED
      - AWS_RESPONSE_CHECKSUM_VALIDATION=WHEN_REQUIRED
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      s3:
        condition: service_started
      s3-create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  s3:
    image: rustfs/rustfs:latest
    container_name: s3
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=${FS_USERNAME}
      - RUSTFS_SECRET_KEY=${FS_PASSWORD}
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - s3_data:/data
      - s3_logs:/logs
    command: >
      --address :9000
      --console-enable
      /data

  s3-create-bucket:
    image: amazon/aws-cli:latest
    container_name: s3-create-bucket
    depends_on:
      - s3
    environment:
      - AWS_ACCESS_KEY_ID=${FS_USERNAME}
      - AWS_SECRET_ACCESS_KEY=${FS_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://s3:9000
      - AWS_REQUEST_CHECKSUM_CALCULATION=WHEN_REQUIRED
      - AWS_RESPONSE_CHECKSUM_VALIDATION=WHEN_REQUIRED
      - FS_BUCKET=${FS_BUCKET}
    entrypoint: >
      /bin/sh -c "
      aws configure set default.s3.addressing_style path;
      until aws s3api list-buckets > /dev/null; do sleep 2; done;
      aws s3api create-bucket --bucket $$FS_BUCKET || true;
      aws s3api put-bucket-policy --bucket $$FS_BUCKET --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::'$$FS_BUCKET'/*\"]}]}';
      exit 0;
      "

volumes:
  mongo_data:
  redis_data:
  s3_data:
  s3_logs:
